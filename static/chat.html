<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.json" />
    <title>SolarTurtle</title>
    <style>
      :root {
        --bg: #000;
        --fg: #fff;
        --dim: #9a9a9a;
        --accent: #57e07a;
        --error: #ff5d5d;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, 'DejaVu Sans', sans-serif;
        font-size: 17px;
        display: flex;
        flex-direction: column;
        height: 100dvh;
      }
      #topbar {
        border-bottom: 1px solid #222;
        flex-shrink: 0;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 5px 12px;
        font-size: 12px;
        color: var(--dim);
        flex-wrap: wrap;
      }
      .row + .row {
        border-top: 1px solid #161616;
      }
      .rlabel {
        width: 52px;
        flex-shrink: 0;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--fg);
        font-weight: 700;
      }
      .hint {
        font-size: 11px;
        color: #a8a8a8;
      }
      /* Live "voice detected" flash, driven by the VAD probability. */
      .heard {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: transparent;
        flex-shrink: 0;
        transition: background 0.1s;
      }
      .heard.live {
        background: var(--error);
        animation: pulse 0.4s ease-in-out infinite;
      }
      /* The speak button, always available and clearly an action. */
      .box.act {
        margin-left: 4px;
        font-weight: 600;
        border-color: var(--accent);
        color: var(--fg);
      }
      .box[disabled] {
        opacity: 0.25;
        cursor: not-allowed;
      }
      .box.act.live {
        background: var(--error);
        border-color: var(--error);
        color: var(--fg);
        opacity: 1;
        animation: blink 1s steps(2, start) infinite;
      }
      .box.act.pending {
        border-color: #ffd27b;
        color: #ffd27b;
        opacity: 1;
      }
      @keyframes blink {
        50% {
          opacity: 0.35;
        }
      }
      #voicebanner {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 14px;
        border-bottom: 1px solid #1c5c31;
        color: var(--accent);
        font-size: 15px;
        font-weight: 600;
      }
      #voicebanner.hidden {
        display: none; /* beats the ID selector's display:flex */
      }
      #voicebanner.red {
        background: #2a0d0d;
        border-bottom-color: #5c1c1c;
        color: var(--error);
      }
      #voicebanner .pulse {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: currentColor;
        animation: pulse 1s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.35;
          transform: scale(0.7);
        }
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--dim);
        flex-shrink: 0;
      }
      .dot.ok {
        background: var(--accent);
      }
      .dot.err {
        background: var(--error);
      }
      #transcript {
        flex: 1;
        overflow-y: auto;
        padding: 12px 16px;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .me {
        color: var(--fg);
        font-weight: 600;
        margin-top: 18px; /* blank breathing room between exchanges */
      }
      .me:first-child {
        margin-top: 0;
      }
      .model {
        color: var(--accent); /* the kami speaks in turtle green */
      }
      .meta {
        color: var(--dim);
        font-size: 12px;
        margin-top: 4px;
      }
      .busy {
        color: #ffd27b;
        font-style: italic;
      }
      .error {
        color: var(--error);
      }
      #inputbar {
        display: flex;
        gap: 8px;
        padding: 10px 12px;
        border-top: 1px solid #222;
        background: var(--bg);
        padding-bottom: max(10px, env(safe-area-inset-bottom));
      }
      #mic,
      #send,
      #tts {
        border: 1px solid #444;
        background: #111;
        color: var(--fg);
        border-radius: 8px;
        font-size: 20px;
        padding: 8px 12px;
        cursor: pointer;
        flex-shrink: 0;
      }
      #mic.recording {
        background: var(--error);
        border-color: var(--error);
      }
      .thinking {
        color: var(--dim);
        font-style: italic;
      }
      .thinking::after {
        content: '...';
        animation: dots 1.2s steps(4, end) infinite;
      }
      @keyframes dots {
        0% {
          content: '';
        }
        25% {
          content: '.';
        }
        50% {
          content: '..';
        }
        75% {
          content: '...';
        }
      }
      #dot.busy {
        background: var(--accent);
        animation: pulse 1s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        from {
          opacity: 0.3;
        }
        to {
          opacity: 1;
        }
      }
      #tts.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #000;
      }
      #q {
        flex: 1;
        min-width: 0;
        background: #111;
        color: var(--fg);
        border: 1px solid #444;
        border-radius: 8px;
        font-size: 16px;
        padding: 10px 12px;
      }
      #q:focus {
        outline: none;
        border-color: var(--accent);
      }
      #modelsel {
        background: #111;
        color: #ddd;
        border: 1px solid #555;
        border-radius: 6px;
        font-size: 13px;
        max-width: 150px;
      }
      #dashlink {
        margin-left: auto;
        text-decoration: none;
        font-size: 13px;
        color: #ddd;
        border: 1px solid #555;
        border-radius: 6px;
        padding: 4px 10px;
      }
      #hw {
        color: #d0d0d0;
      }
      #memtoggles {
        margin-left: auto;
      }
      .memt,
      .box {
        background: #161616;
        border: 1px solid #555;
        border-radius: 6px;
        color: #e8e8e8;
        font-size: 13px;
        font-family: inherit;
        padding: 5px 11px;
        cursor: pointer;
      }
      .memt.on,
      .box.on {
        color: var(--fg);
        border-color: var(--accent);
        background: #0f2a18;
      }
      .box:active {
        background: #262626;
      }
      #title {
        font-size: 16px;
        letter-spacing: 2px;
        color: var(--accent);
        font-weight: bold;
      }
      #title .lvl {
        color: var(--accent);
        font-weight: normal;
        letter-spacing: 1px;
        font-size: 12px;
        opacity: 0.85;
      }
      #save {
        font-size: 20px;
        padding: 8px 16px;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <header id="topbar">
      <div class="row">
        <span id="title">SolarTurtle <span class="lvl">· turtle kami · level 1</span></span>
      </div>
      <div class="row">
        <select id="modelsel" title="Model"></select>
        <a href="/dashboard" id="dashlink" title="Dashboard">Dashboard</a>
      </div>
      <div class="row">
        <span class="rlabel">vitals</span>
        <span class="dot" id="dot"></span>
        <span id="hw"></span>
      </div>
      <div class="row">
        <span class="rlabel">memory</span>
        <button class="memt on" data-cat="identity" title="Who the kami is">🧠 identity</button>
        <button class="memt" data-cat="sensors" title="What the kami senses">📡 sensors</button>
        <button class="memt" data-cat="community" title="Notes people left">📝 notes</button>
        <span class="hint">more memory, slower answers</span>
      </div>
      <div class="row">
        <span class="rlabel">voice</span>
        <button class="box" id="vwake" title="Wake word — tap to turn on or off">“wake”</button>
        <button class="box" id="vwakeedit" title="Change the wake word">✎</button>
        <button class="box" id="vvad" title="Silero VAD gate — filters silence before whisper">VAD</button>
        <button class="box act" id="vlisten" title="Speak to the kami">🎤 speak</button>
        <button class="box" id="vrestart" title="Restart the voice process (last resort)">↻</button>
        <span class="hint" id="vstate">offline</span>
        <span class="heard" id="vhear" title="voice detected"></span>
      </div>
    </header>
    <div id="voicebanner" class="hidden"><span class="pulse"></span><span id="vbtext"></span></div>
    <div id="transcript"></div>
    <div id="inputbar">
      <button id="mic" title="Dictate" class="hidden">🎤</button>
      <input id="q" type="text" placeholder="Ask something…" autocomplete="off" autofocus />
      <button id="send" title="Ask the kami">➤</button>
      <button id="save" title="Save my last message to the kami's memory">💾</button>
      <button id="tts" title="Speak answers" class="hidden">🔊</button>
    </div>
    <script>
      'use strict';

      const transcript = document.getElementById('transcript');
      const qInput = document.getElementById('q');
      const micBtn = document.getElementById('mic');
      const sendBtn = document.getElementById('send');
      const saveBtn = document.getElementById('save');
      const ttsBtn = document.getElementById('tts');
      const dot = document.getElementById('dot');
      const modelSel = document.getElementById('modelsel');
      const hwLabel = document.getElementById('hw');

      let busy = false;
      let ttsOn = true; // speaker on by default
      let currentModelDiv = null;
      let gotFirstChunk = false;
      let thinkingDiv = null;
      let lastUserMsg = null; // remembered so 💾 can commit it to memory
      let lastTurnTs = null; // dedupe turns coming from other frontends

      function resetBusy() {
        busy = false;
        sendBtn.disabled = false;
        currentModelDiv = null;
        hideThinking();
        dot.classList.remove('busy');
      }

      function showThinking() {
        hideThinking();
        thinkingDiv = addLine('MODEL is thinking', 'thinking');
        dot.classList.add('busy');
      }

      function hideThinking() {
        if (thinkingDiv) {
          thinkingDiv.remove();
          thinkingDiv = null;
        }
      }

      function addLine(text, cls) {
        const div = document.createElement('div');
        div.className = cls || '';
        div.textContent = text;
        transcript.appendChild(div);
        transcript.scrollTop = transcript.scrollHeight;
        return div;
      }

      function addUser(text) {
        addLine('🙂 ' + text, 'me');
      }

      function startModel() {
        currentModelDiv = addLine('🐢 ', 'model');
        return currentModelDiv;
      }

      function appendChunk(text) {
        hideThinking(); // first chunk replaces the thinking indicator
        if (!currentModelDiv) currentModelDiv = startModel();
        currentModelDiv.textContent += text;
        transcript.scrollTop = transcript.scrollHeight;
      }

      function finishModel(metrics) {
        if (metrics && metrics.tokens_per_second) {
          addLine(
            `[${metrics.output_tokens ?? '?'} tok | ${metrics.tokens_per_second.toFixed(2)} tok/s | ${metrics.total_response_seconds?.toFixed(1)}s]`,
            'meta',
          );
        }
        if (ttsOn && currentModelDiv) {
          speak(currentModelDiv.textContent.replace(/^🐢\s*/, ''));
        }
        resetBusy();
      }

      function speak(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 1.0;
        u.pitch = 1.0;
        window.speechSynthesis.speak(u);
      }

      async function refreshStatus() {
        try {
          const r = await fetch('/api/status');
          const s = await r.json();
          dot.className = 'dot ' + (s.available ? 'ok' : 'err') + (s.active ? ' busy' : '');
          hwLabel.textContent = `CPU ${s.cpu_percent?.toFixed(0) ?? '?'}% · RAM ${s.ram_percent?.toFixed(0) ?? '?'}% · ${s.temperature_c?.toFixed(0) ?? '?'}°C`;

          // The toggles are NODE settings, not page settings: another phone
          // (or the voice loop) may have changed them. Mirror, don't fight.
          if (s.settings && !busy && Date.now() > settingsHeldUntil) {
            const on = new Set(s.settings.memory || []);
            document.querySelectorAll('.memt').forEach((b) => {
              b.classList.toggle('on', on.has(b.dataset.cat));
            });
          }
          if (s.settings?.voice && Date.now() > voiceHeldUntil) {
            voiceCfg = s.settings.voice;
            renderVoice();
          }
          if (s.voice) {
            const st = s.voice.state;
            curVoiceState = st;
            let label = VOICE_LABEL[st] || st;
            if (st === 'waking') label = 'waiting for “' + voiceCfg.wake_word + '”';
            vState.textContent = label + (s.voice.detail ? ' · ' + s.voice.detail : '');
            // Live "voice detected" dot, straight from the VAD probability.
            vHear.classList.toggle('live', (s.voice.vad || 0) > 0.5);

            // Banner: red while recording, amber for "didn't hear that",
            // hidden the rest of the time.
            if (st === 'listening') {
              vBanner.className = 'red';
              vBanText.textContent = '🎤 listening — speak now · pauses end it';
            } else if (st === 'empty' || st === 'error') {
              vBanner.className = 'red';
              vBanText.textContent =
                st === 'empty' ? '🤷 I didn’t hear that — try again' : '⚠️ the model stalled — try again';
            } else {
              vBanner.className = 'hidden';
            }

            if (st === 'listening') speakPending = 0; // request honoured
            renderTalkButton();

            // Live voice turn: show the question when it starts and stream
            // the answer as it is generated, so nothing needs a page refresh.
            const vq = s.voice.question || '';
            if (vq && vq !== liveQ) {
              liveQ = vq;
              lastLiveQ = vq;
              addLine('🙂 ' + vq, 'me');
              liveDiv = addLine('🐢 ', 'model');
            }
            if (vq && liveDiv) {
              liveDiv.textContent = '🐢 ' + (s.voice.partial || '');
              transcript.scrollTop = transcript.scrollHeight;
            }
            if (!vq) {
              liveQ = null;
              liveDiv = null;
            }

            if (st !== prevVoiceState) {
              if (st === 'listening') beep(880, 90);
              prevVoiceState = st;
            }
          }

          // Turns that happened at the microphone (or the SSH console) are
          // published to the append-only turn log; show them here. Our own
          // web turns are skipped — they already streamed into the page.
          // A voice turn already shown live above is skipped too.
          if (s.last_turn && s.last_turn.ts !== lastTurnTs && !busy) {
            lastTurnTs = s.last_turn.ts;
            if (s.last_turn.source !== 'web' && s.last_turn.q) {
              if (s.last_turn.q === lastLiveQ) {
                // Already streamed live — just speak it if asked.
                if (ttsOn && s.last_turn.a) speak(s.last_turn.a);
              } else {
                addLine('🙂 ' + s.last_turn.q, 'me');
                if (s.last_turn.a) {
                  addLine('🐢 ' + s.last_turn.a, 'model');
                  if (ttsOn) speak(s.last_turn.a);
                }
              }
            }
          }
        } catch {
          dot.className = 'dot err';
        }
      }

      async function loadModels() {
        try {
          const r = await fetch('/api/models');
          const d = await r.json();
          modelSel.innerHTML = '';
          for (const name of d.models) {
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            if (name === d.default) opt.selected = true;
            modelSel.appendChild(opt);
          }
          if (!d.models.length) {
            modelSel.innerHTML = '<option>(no models)</option>';
          }
        } catch {
          modelSel.innerHTML = '<option>?</option>';
        }
      }

      // Parse an SSE stream from a fetch Response body. Calls onEvent(name, data).
      async function readSSE(response, onEvent) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';

        const dispatch = (rawEvent) => {
          let name = 'message';
          let data = '';
          for (const line of rawEvent.split('\n')) {
            if (line.startsWith('event:')) name = line.slice(6).trim();
            else if (line.startsWith('data:')) data += (data ? '\n' : '') + line.slice(5).replace(/^ /, '');
            else if (line.startsWith(':')) return; // comment / heartbeat
          }
          if (data !== '' || name === 'start' || name === 'done' || name === 'error' || name === 'busy') {
            onEvent(name, data);
          }
        };

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buf.indexOf('\n\n')) !== -1) {
            dispatch(buf.slice(0, idx));
            buf = buf.slice(idx + 2);
          }
        }
        // Flush any trailing event that arrived without its blank-line
        // terminator (some servers close right after the final event).
        buf += decoder.decode();
        if (buf.trim() !== '') dispatch(buf);
      }

      async function send() {
        const question = qInput.value.trim();
        if (!question || busy) return;
        busy = true;
        sendBtn.disabled = true;
        addUser(question);
        lastUserMsg = question;
        qInput.value = '';
        showThinking();
        gotFirstChunk = false;

        // Watchdog: only fires if NOTHING arrived after sending — a truly
        // dead connection. Mid-answer pauses (Ollama stalls on the Pi can
        // exceed 30 s) are legal and must not trigger a false timeout.
        const watchdog = setInterval(() => {
          if (busy && !gotFirstChunk && Date.now() - sentAt > 60000) {
            clearInterval(watchdog);
            addLine('⚠ no response (connection failed)', 'error');
            resetBusy();
          }
        }, 5000);
        const sentAt = Date.now();

        try {
          const r = await fetch('/api/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              question,
              model: modelSel.value,
              memory: activeMemoryCategories(),
            }),
          });
          if (!r.ok) throw new Error('HTTP ' + r.status);

          await readSSE(r, (name, data) => {
            if (name === 'chunk') {
              gotFirstChunk = true;
              appendChunk(data);
            } else if (name === 'done') finishModel(JSON.parse(data).metrics);
            else if (name === 'busy') {
              addLine('⏳ ' + data, 'busy');
              resetBusy();
            } else if (name === 'error') {
              addLine('ERROR: ' + data, 'error');
              resetBusy();
            }
          });
          // If the stream ended without a done/error, re-enable input.
          if (busy) resetBusy();
        } catch (err) {
          addLine('ERROR: ' + err.message, 'error');
          resetBusy();
        } finally {
          clearInterval(watchdog);
        }
      }

      // --- Web Speech API (STT on the phone) ---
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      let rec = null,
        recActive = false;

      if (SR) {
        rec = new SR();
        rec.continuous = false;
        rec.interimResults = true;
        rec.lang = 'en-US';
        rec.onresult = (e) => {
          let interim = '',
            final = '';
          for (let i = 0; i < e.results.length; i++) {
            if (e.results[i].isFinal) final += e.results[i][0].transcript;
            else interim += e.results[i][0].transcript;
          }
          qInput.value = final || interim;
        };
        rec.onend = () => {
          recActive = false;
          micBtn.classList.remove('recording');
          if (qInput.value.trim()) send();
        };
        rec.onerror = (e) => {
          recActive = false;
          micBtn.classList.remove('recording');
          if (e.error !== 'no-speech') addLine('Mic error: ' + e.error, 'error');
        };
      } else {
        micBtn.disabled = true;
        micBtn.title = 'Speech recognition not supported in this browser';
      }

      micBtn.addEventListener('click', () => {
        if (!rec) return;
        if (recActive) {
          rec.stop();
        } else {
          recActive = true;
          micBtn.classList.add('recording');
          qInput.value = '';
          rec.start();
        }
      });

      ttsBtn.addEventListener('click', () => {
        ttsOn = !ttsOn;
        ttsBtn.classList.toggle('on', ttsOn);
        if (!ttsOn && window.speechSynthesis) window.speechSynthesis.cancel();
      });

      sendBtn.addEventListener('click', send);
      qInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') send();
      });

      // 💾 — save the last thing I said into the kami's community memory.
      saveBtn.addEventListener('click', async () => {
        const text = qInput.value.trim() || lastUserMsg;
        if (!text) {
          addLine('💾 Say something first, then tap 💾 to have it remembered.', 'meta');
          return;
        }
        try {
          const r = await fetch('/api/note', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ note: text }),
          });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          addLine('💾 remembered: "' + text + '"', 'meta');
          qInput.value = '';
          // The kami acknowledges — it will see the note next question.
          addLine('KAMI: I will remember that.', 'model');
        } catch (err) {
          addLine('ERROR saving note: ' + err.message, 'error');
        }
      });

      // Memory category toggles (🧠 identity / 📡 sensors / 📝 community).
      // These are NODE-wide: saved on the Pi, so the microphone and the
      // console read exactly the same memory as this page.
      let settingsHeldUntil = 0; // ignore polled state right after a change

      function activeMemoryCategories() {
        return [...document.querySelectorAll('.memt.on')].map((b) => b.dataset.cat);
      }
      async function saveSettings() {
        settingsHeldUntil = Date.now() + 3000;
        try {
          await fetch('/api/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              memory: activeMemoryCategories(),
              model: modelSel.value || null,
            }),
          });
        } catch {}
      }
      document.querySelectorAll('.memt').forEach((b) =>
        b.addEventListener('click', () => {
          b.classList.toggle('on');
          saveSettings();
        }),
      );
      modelSel.addEventListener('change', saveSettings);

      // --- the Pi's microphone, driven from here ---------------------------
      // Nothing is started or stopped here: the voice process polls these
      // settings and reports back what it is doing — or doesn't, if it isn't
      // running at all, and then the state honestly reads "offline".
      // The wake word is a simple on/off; the speak button always works.
      const vWake = document.getElementById('vwake');
      const vWakeEdit = document.getElementById('vwakeedit');
      const vVad = document.getElementById('vvad');
      const vListen = document.getElementById('vlisten');
      const vRestart = document.getElementById('vrestart');
      const vState = document.getElementById('vstate');
      const vHear = document.getElementById('vhear');
      const vBanner = document.getElementById('voicebanner');
      const vBanText = document.getElementById('vbtext');

      const VOICE_LABEL = {
        offline: 'voice process not running on the Pi',
        off: 'wake word off — press speak to talk',
        waking: 'waiting for the wake word',
        checking: 'checking for the wake word…',
        listening: 'recording…',
        transcribing: 'transcribing…',
        thinking: 'asking the kami…',
        empty: 'didn’t hear that',
        error: 'the model stalled',
      };

      let voiceCfg = { enabled: false, wake_word: 'wake', vad: true };
      let voiceHeldUntil = 0;
      let curVoiceState = '';
      let prevVoiceState = '';
      let liveQ = null; // voice question currently being answered
      let liveDiv = null; // its streaming answer line in the transcript
      let lastLiveQ = null; // last voice question shown live (dedupe the log)

      // A short tone, so you know it is listening without watching the screen.
      let audioCtx = null;
      function beep(freq, ms) {
        try {
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const t = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(0.3, t + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + ms / 1000 + 0.02);
        } catch {}
      }

      function renderVoice() {
        vWake.textContent = '“' + voiceCfg.wake_word + '” ' + (voiceCfg.enabled ? '· on' : '· off');
        vWake.classList.toggle('on', voiceCfg.enabled);
        vVad.textContent = 'VAD ' + (voiceCfg.vad ? 'on' : 'off');
        vVad.classList.toggle('on', voiceCfg.vad);
        renderTalkButton();
      }
      async function postVoice(patch) {
        voiceHeldUntil = Date.now() + 3000;
        voiceCfg = { ...voiceCfg, ...patch };
        renderVoice();
        try {
          await fetch('/api/voice', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(patch),
          });
        } catch {}
      }
      vWake.addEventListener('click', () => postVoice({ enabled: !voiceCfg.enabled }));
      vWakeEdit.addEventListener('click', () => {
        const w = prompt('Wake word — say this to get the kami’s attention:', voiceCfg.wake_word);
        if (w && w.trim()) postVoice({ wake_word: w.trim() });
      });
      vVad.addEventListener('click', () => postVoice({ vad: !voiceCfg.vad }));

      // Last resort: bounce the voice process from the page.
      vRestart.addEventListener('click', async () => {
        vRestart.disabled = true;
        vState.textContent = 'restarting voice process…';
        try {
          const d = await (await fetch('/api/voice/restart', { method: 'POST' })).json();
          vState.textContent = d.ok ? 'voice process restarted' : 'restart failed: ' + (d.err || '?');
        } catch (e) {
          vState.textContent = 'restart failed: ' + e.message;
        }
        setTimeout(() => {
          vRestart.disabled = false;
          refreshStatus();
        }, 4000);
      });

      // The speak button is a toggle: speak → stop → speak. Which it shows is
      // driven by the Pi's actual state, not by a local timer. Between the
      // press and the loop actually starting to record there can be a short
      // wait (the wake-word window must finish), so we show "starting…".
      let speakPending = 0; // timestamp of a press not yet honoured, 0 = none
      function isRecording() {
        return curVoiceState === 'listening';
      }
      function renderTalkButton() {
        // Re-evaluated on every poll so a brief "offline" can't wedge it.
        vListen.disabled = curVoiceState === 'offline';
        if (vListen.disabled) {
          vListen.textContent = '🎤 speak';
          vListen.classList.remove('live', 'pending');
          return;
        }
        if (speakPending && !isRecording()) {
          if (Date.now() - speakPending > 30000)
            speakPending = 0; // request lost
          else {
            vListen.textContent = curVoiceState === 'thinking' ? '🎤 waiting…' : '🎤 starting…';
            vListen.classList.remove('live');
            vListen.classList.add('pending');
            return;
          }
        }
        vListen.classList.remove('pending');
        const rec = isRecording();
        vListen.textContent = rec ? '■ stop' : '🎤 speak';
        vListen.classList.toggle('live', rec);
      }
      vListen.addEventListener('click', () => {
        if (isRecording()) {
          fetch('/api/stop', { method: 'POST' }).catch(() => {});
        } else {
          beep(880, 90); // also unlocks the AudioContext on iOS
          speakPending = Date.now();
          renderTalkButton();
          refreshStatus(); // look right away, not on the next 1.5–5 s poll
          fetch('/api/listen', { method: 'POST' }).catch(() => {});
        }
      });
      renderVoice();

      // Speaker default-on: reflect it in the button state.
      ttsBtn.classList.add('on');

      loadModels();
      refreshStatus();
      // Faster whenever the microphone could be active (wake word on, a speak
      // press in flight, or mid-recording), so state changes feel immediate.
      (function poll() {
        const busy =
          voiceCfg.enabled ||
          speakPending ||
          ['listening', 'transcribing', 'checking', 'thinking', 'empty', 'error'].includes(curVoiceState);
        setTimeout(
          async () => {
            await refreshStatus();
            poll();
          },
          busy ? 900 : 5000,
        );
      })();
    </script>
  </body>
</html>
